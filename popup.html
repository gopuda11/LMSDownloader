<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LMS Video Downloader</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="header-left">
        <img src="icon-48.png" alt="Logo" class="app-logo">
        <div>
          <h1 class="app-title">LMS Downloader</h1>
          <div id="school-badge" class="badge">이러닝 감지 중...</div>
        </div>
      </div>
      <button id="rescan-btn" class="icon-btn" title="다시 스캔">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
          <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
        </svg>
      </button>
    </header>

    <main id="main-content">
      <section id="document-section" class="hidden" aria-label="강의자료">
        <h2 class="materials-heading">강의자료 · PDF 변환</h2>
        <div id="document-list" class="video-list"></div>
      </section>
      <p class="material-tip">PPT / PPTX 자료를 브라우저에서 PDF로 변환합니다. <button id="local-pdf-btn" class="btn btn-secondary">내 PPT / PPTX 파일 선택</button></p>
      <div id="loading-state" class="state-container">
        <div class="spinner"></div>
        <p>강의 영상을 탐색하고 있습니다...</p>
      </div>

      <div id="empty-state" class="state-container hidden">
        <div class="empty-icon">📺</div>
        <h3>감지된 강의 영상이 없습니다</h3>
        <p class="empty-tip">LMS에 로그인한 뒤 다운로드할 개별 강의 화면을 열어주세요.<br>기간이 종료된 강의도 자동으로 탐색합니다.</p>
        <button id="empty-rescan-btn" class="btn btn-primary">다시 스캔하기</button>
      </div>

      <div id="video-list" class="video-list hidden">
        <!-- Rendered dynamically -->
      </div>
      <p id="automatic-status" class="status-msg" role="status" aria-live="polite">기간 종료 강의도 자동으로 찾습니다.</p>
    </main>

    <footer class="app-footer">
      <span id="version-tag">v1.4.0</span>
      <div class="footer-links">
        <a href="https://github.com/gopuda11/LMSDownloader" target="_blank" rel="noreferrer">GitHub</a>
        <span>·</span>
        <a href="#" id="help-link">도움말</a>
      </div>
    </footer>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="recovery.js"></script>
  <script src="documents.js"></script>
  <script src="ilos.js"></script>
  <script src="popup-ilos.js"></script>
  <script src="popup.js"></script>
</body>
</html>
