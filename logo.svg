<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C3AED"/>
      <stop offset="0.55" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="arrow" gradientUnits="userSpaceOnUse" x1="0" y1="104" x2="0" y2="316">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E0F2FE"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#1E1B4B" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- 배경 -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bg)"/>
  <path d="M136 16 H376 A120 120 0 0 1 496 136 V190 C400 240 112 240 16 190 V136 A120 120 0 0 1 136 16 Z" fill="url(#gloss)"/>

  <!-- 속도선 -->
  <g stroke="#fff" stroke-opacity="0.35" stroke-width="12" stroke-linecap="round">
    <line x1="122" y1="96" x2="122" y2="150"/>
    <line x1="390" y1="84" x2="390" y2="150"/>
    <line x1="342" y1="110" x2="342" y2="150"/>
  </g>

  <!-- 다운로드 화살표 + 트레이 -->
  <g filter="url(#shadow)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M256 104 V288" stroke="url(#arrow)" stroke-width="48"/>
    <path d="M172 232 L256 316 L340 232" stroke="url(#arrow)" stroke-width="48"/>
    <path d="M122 330 V366 A30 30 0 0 0 152 396 H360 A30 30 0 0 0 390 366 V330" stroke="#fff" stroke-width="38"/>
  </g>

  <!-- 반짝이 -->
  <path d="M410 296 L420 322 L446 332 L420 342 L410 368 L400 342 L374 332 L400 322 Z" fill="#FDE047"/>
  <path d="M100 262 L106 278 L122 284 L106 290 L100 306 L94 290 L78 284 L94 278 Z" fill="#FDE047" opacity="0.9"/>
  <circle cx="404" cy="236" r="9" fill="#FDE047" opacity="0.8"/>
</svg>
